<!-- ===== FLECHA DESLIZAR HACIA ABAJO ===== -->

<style>
.flecha-scroll {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 90px;
    color: #b3005e;
    cursor: pointer;
    animation: flotar 1.5s infinite;
    z-index: 999;
}

@keyframes flotar {
    0% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 10px); }
    100% { transform: translate(-50%, 0); }
}

.flecha-scroll:hover {
    color: #ff4d6d;
}
</style>

<div class="flecha-scroll" onclick="scrollAbajo()">
    ⮟
</div>

<script>
function scrollAbajo() {
    window.scrollBy({
        top: window.innerHeight,
        behavior: "smooth"
    });
}
</script>

<!-- ===== FIN FLECHA ===== -->
