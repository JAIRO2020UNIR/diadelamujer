<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de la Mujer</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    text-align: center;
    color: #333;
    overflow-x: hidden;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.hero{
    padding: 80px 20px;
}

h1{
    font-size: 3rem;
    font-weight: 800;
    color: #8e044d;
}

.mensaje{
    max-width: 800px;
    margin: auto;
    font-size: 1.2rem;
}

.card-custom{
    border-radius: 20px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
}

.btn-custom{
    background-color: #8e044d;
    color: white;
    border-radius: 30px;
    padding: 12px 30px;
    transition: 0.3s;
}

.btn-custom:hover{
    background-color: #b3005e;
    transform: scale(1.05);
}

.footer{
    margin-top: 50px;
    padding: 20px;
    font-size: 0.9rem;
    color: #555;
}

/* Confetti */
.confetti{
    position: fixed;
    width: 10px;
    height: 10px;
    background: pink;
    top: -10px;
    animation: fall 5s linear infinite;
}

@keyframes fall{
    to{
        transform: translateY(100vh) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="hero">
    <h1>🌸 Feliz Día de la Mujer 🌸</h1>
    <p class="mensaje mt-4">
        Hoy celebramos la fortaleza, la inteligencia, el amor y la valentía de todas las mujeres.
        Gracias por transformar el mundo con tu luz, tu determinación y tu esencia única.
    </p>

    <button class="btn btn-custom mt-4" onclick="mostrarMensaje()">
        Descubre tu mensaje especial ✨
    </button>

    <div id="mensajeEspecial" class="mt-4 fw-bold fs-5"></div>
</div>

<!-- Carrusel -->
<div class="container mt-5">
    <div id="carouselExample" class="carousel slide card-custom" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" class="d-block w-100" style="border-radius:20px;">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" class="d-block w-100" style="border-radius:20px;">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91" class="d-block w-100" style="border-radius:20px;">
            </div>
        </div>
    </div>
</div>

<div class="footer">
    Con admiración y respeto 💜
</div>

<!-- Música opcional -->
<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
</audio>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function mostrarMensaje(){
    document.getElementById("mensajeEspecial").innerHTML =
    "💜 Eres inspiración, eres fuerza, eres historia y futuro. Nunca dejes de brillar.";
    lanzarConfetti();
}

function lanzarConfetti(){
    for(let i=0; i<30; i++){
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random()*100 + "vw";
        confetti.style.background = ["#ff4d6d","#ff99c8","#c77dff","#ffafcc"][Math.floor(Math.random()*4)];
        confetti.style.animationDuration = (Math.random()*3+2) + "s";
        document.body.appendChild(confetti);
        setTimeout(()=>{ confetti.remove(); },5000);
    }
}
</script>

</body>
</html>
